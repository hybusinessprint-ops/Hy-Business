<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HY STORE | Official Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

:root{
 --bg:#060910;
 --card:#0d1524;
 --card2:#111c2e;
 --text:#f8fafc;
 --muted:#94a3b8;
 --cyan:#00d9ff;
 --green:#00e676;
 --red:#ff5252;
 --border:rgba(255,255,255,.08);
 --shadow:0 15px 45px rgba(0,0,0,.35);
}

body{
 font-family:Poppins,sans-serif;
 background:
 radial-gradient(circle at 10% 10%,rgba(0,217,255,.06),transparent 25%),
 radial-gradient(circle at 90% 20%,rgba(0,230,118,.05),transparent 25%),
 var(--bg);
 color:var(--text);
 overflow-x:hidden;
 padding-bottom:70px;
}

a{text-decoration:none;color:inherit}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
.container{width:min(1280px,95%);margin:auto}

/* TOP BAR */
.top-navy-bar{
 background:#091224;
 border-bottom:1px solid var(--border);
 padding:8px 0;
 font-size:11px;
}

.top-navy-bar .inner{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
}

.top-nav-links{
 display:flex;
 align-items:center;
 gap:14px;
}

.top-nav-links a{
 color:#cbd5e1;
 transition:.25s;
}

.top-nav-links a:hover{color:var(--cyan)}

.nav-highlight-btn{
 background:linear-gradient(135deg,var(--cyan),var(--green));
 color:#000!important;
 padding:6px 13px;
 border-radius:20px;
 font-weight:800!important;
 display:inline-flex;
 align-items:center;
 gap:6px;
}

.user-head-badge{
 display:flex;
 align-items:center;
 gap:7px;
 background:rgba(255,255,255,.08);
 border:1px solid var(--border);
 padding:4px 10px 4px 5px;
 border-radius:25px;
 cursor:pointer;
}

.user-head-badge img{
 width:25px;
 height:25px;
 border-radius:50%;
 object-fit:cover;
 border:1px solid var(--cyan);
}

/* HEADER */
header{
 position:sticky;
 top:0;
 z-index:999;
 background:rgba(6,9,16,.92);
 backdrop-filter:blur(18px);
 border-bottom:1px solid var(--border);
 padding:12px 0;
}

.header-inner{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:18px;
}

.logo{
 font-size:25px;
 font-weight:800;
 white-space:nowrap;
 background:linear-gradient(135deg,var(--cyan),var(--green));
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
}

.search-box{
 flex:1;
 max-width:650px;
 display:flex;
 height:43px;
 border:1px solid var(--border);
 border-radius:25px;
 overflow:hidden;
 background:rgba(255,255,255,.045);
 box-shadow:inset 0 0 20px rgba(255,255,255,.015);
}

.search-box select{
 background:#101a2b;
 color:var(--muted);
 border:0;
 border-right:1px solid var(--border);
 padding:0 12px;
 outline:0;
 font-size:11px;
}

.search-box input{
 flex:1;
 min-width:0;
 background:transparent;
 border:0;
 outline:0;
 color:white;
 padding:0 15px;
 font-size:12px;
}

.search-box input::placeholder{color:#64748b}

.search-box button{
 width:55px;
 border:0;
 background:linear-gradient(135deg,var(--cyan),var(--green));
 color:#000;
 font-size:15px;
}

.header-cart{
 font-size:21px;
 position:relative;
 cursor:pointer;
}

.cart-icon{position:relative}

.cart-badge{
 position:absolute;
 top:-9px;
 right:-10px;
 width:18px;
 height:18px;
 display:grid;
 place-items:center;
 border-radius:50%;
 background:var(--green);
 color:#000;
 font-size:9px;
 font-weight:800;
}

/* QUICK CATEGORIES */
.app-quick-cats{
 display:flex;
 gap:14px;
 overflow-x:auto;
 scrollbar-width:none;
 padding:14px 0 10px;
}

.app-quick-cats::-webkit-scrollbar{display:none}

.app-cat-item{
 width:75px;
 flex:0 0 auto;
 text-align:center;
 cursor:pointer;
}

.app-cat-icon{
 width:51px;
 height:51px;
 margin:auto auto 6px;
 display:grid;
 place-items:center;
 background:var(--card);
 border:1px solid var(--border);
 border-radius:15px;
 color:var(--cyan);
 font-size:19px;
 transition:.25s;
}

.app-cat-item:hover .app-cat-icon,
.app-cat-item.active .app-cat-icon{
 background:linear-gradient(135deg,var(--cyan),var(--green));
 color:#000;
 transform:translateY(-2px);
}

.app-cat-item span{
 display:block;
 color:var(--muted);
 font-size:10px;
 white-space:nowrap;
}

/* HERO */
.hero-layout{
 display:grid;
 grid-template-columns:225px 1fr 235px;
 gap:15px;
 margin-top:8px;
}

.cat-sidebar,
.side-promo{
 background:linear-gradient(145deg,var(--card),#0b1321);
 border:1px solid var(--border);
 border-radius:15px;
 overflow:hidden;
 box-shadow:var(--shadow);
}

.cat-sidebar{padding:8px 0}

.cat-item{
 display:flex;
 align-items:center;
 gap:11px;
 padding:11px 17px;
 color:var(--muted);
 font-size:12px;
 transition:.2s;
 cursor:pointer;
}

.cat-item i{width:18px;text-align:center}

.cat-item:hover,
.cat-item.active{
 color:var(--cyan);
 background:rgba(0,217,255,.08);
 border-left:3px solid var(--cyan);
 padding-left:14px;
}

/* SLIDER */
.hero-banner-slider{
 height:300px;
 position:relative;
 overflow:hidden;
 border-radius:17px;
 border:1px solid var(--border);
 background:#000;
 box-shadow:var(--shadow);
}

.slide{
 position:absolute;
 inset:0;
 opacity:0;
 transition:opacity .7s ease;
 pointer-events:none;
}

.slide.active{
 opacity:1;
 pointer-events:auto;
}

.slide img{
 width:100%;
 height:100%;
 object-fit:cover;
 filter:brightness(.68);
}

.slide:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(0deg,rgba(0,0,0,.8),transparent 65%);
}

.slide-inner-info{
 position:absolute;
 z-index:3;
 bottom:18px;
 left:18px;
 right:18px;
 display:flex;
 align-items:flex-end;
 justify-content:space-between;
 gap:10px;
}

.banner-badge-group{
 display:flex;
 flex-direction:column;
 gap:6px;
}

.banner-title-pill{
 max-width:450px;
 background:rgba(4,8,14,.78);
 backdrop-filter:blur(12px);
 border:1px solid rgba(255,255,255,.13);
 padding:7px 13px;
 border-radius:25px;
 font-size:12px;
 font-weight:600;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.banner-price-pill{
 width:max-content;
 background:linear-gradient(135deg,var(--cyan),var(--green));
 color:#000;
 padding:5px 11px;
 border-radius:20px;
 font-size:10px;
 font-weight:800;
}

.banner-action-btn{
 border:0;
 background:var(--green);
 color:#000;
 padding:10px 19px;
 border-radius:25px;
 font-size:11px;
 font-weight:800;
 box-shadow:0 5px 20px rgba(0,230,118,.25);
}

.banner-action-btn:hover{transform:translateY(-2px)}

.dots{
 position:absolute;
 z-index:5;
 top:13px;
 right:13px;
 display:flex;
 gap:5px;
 padding:6px 9px;
 background:rgba(0,0,0,.45);
 backdrop-filter:blur(8px);
 border-radius:20px;
}

.dot{
 width:6px;
 height:6px;
 border-radius:10px;
 background:#64748b;
 cursor:pointer;
 transition:.3s;
}

.dot.active{
 width:17px;
 background:var(--cyan);
}

/* PROMO */
.side-promo{
 padding:22px 15px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 text-align:center;
}

.side-promo i{
 color:var(--cyan);
 font-size:34px;
 margin-bottom:10px;
}

.side-promo h3{font-size:15px}
.side-promo p{
 color:var(--muted);
 font-size:10px;
 line-height:1.5;
 margin:6px 0 14px;
}

.promo-badge{
 color:var(--green);
 border:1px solid rgba(0,230,118,.4);
 background:rgba(0,230,118,.08);
 border-radius:20px;
 padding:5px 10px;
 font-size:9px;
 font-weight:700;
}

/* PRODUCTS */
.products-wrap{margin-top:24px}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}

.section-head h2{
 font-size:19px;
 color:var(--cyan);
}

.product-grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
 gap:15px;
}

.product-card{
 background:linear-gradient(145deg,var(--card),#0b1320);
 border:1px solid var(--border);
 border-radius:14px;
 padding:10px;
 position:relative;
 transition:.3s;
 overflow:hidden;
}

.product-card:hover{
 transform:translateY(-4px);
 border-color:rgba(0,217,255,.4);
 box-shadow:0 12px 30px rgba(0,0,0,.3);
}

.product-img{
 width:100%;
 height:150px;
 object-fit:cover;
 border-radius:9px;
 margin-bottom:8px;
 display:block;
}

.discount-tag{
 position:absolute;
 top:16px;
 left:16px;
 z-index:2;
 background:var(--green);
 color:#000;
 padding:3px 7px;
 border-radius:5px;
 font-size:8px;
 font-weight:800;
}

.product-card h4{
 font-size:12px;
 line-height:1.4;
 font-weight:500;
 height:34px;
 overflow:hidden;
}

.price{
 color:var(--cyan);
 font-size:14px;
 font-weight:800;
 margin-top:5px;
}

.price del{
 color:#64748b;
 font-size:9px;
 margin-left:3px;
}

.card-btn-group{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
 margin-top:10px;
}

.btn-cart,
.btn-buy{
 padding:8px 4px;
 border-radius:8px;
 font-size:10px;
 font-weight:700;
}

.btn-cart{
 color:var(--cyan);
 background:rgba(0,217,255,.04);
 border:1px solid rgba(0,217,255,.5);
}

.btn-buy{
 border:0;
 color:#000;
 background:var(--cyan);
}

.btn-cart:hover{background:rgba(0,217,255,.12)}
.btn-buy:hover{background:var(--green)}

.load-more-btn{
 display:block;
 width:220px;
 margin:25px auto;
 padding:11px;
 border:0;
 border-radius:25px;
 background:linear-gradient(135deg,var(--cyan),var(--green));
 color:#000;
 font-size:11px;
 font-weight:800;
}

/* MODAL */
.modal{
 position:fixed;
 inset:0;
 z-index:10000;
 display:none;
 place-items:center;
 padding:15px;
 background:rgba(0,0,0,.78);
 backdrop-filter:blur(12px);
}

.modal.active{display:grid}

.modal-box{
 width:min(430px,100%);
 max-height:90vh;
 overflow-y:auto;
 position:relative;
 background:linear-gradient(145deg,#101a2b,#0b1320);
 border:1px solid var(--border);
 border-radius:18px;
 padding:20px;
 box-shadow:0 25px 80px rgba(0,0,0,.6);
 animation:modalIn .25s ease;
}

@keyframes modalIn{
 from{opacity:0;transform:translateY(15px) scale(.97)}
 to{opacity:1;transform:none}
}

.close-modal{
 position:absolute;
 top:13px;
 right:13px;
 width:31px;
 height:31px;
 border:1px solid var(--border);
 border-radius:50%;
 background:rgba(255,255,255,.05);
 color:#94a3b8;
 z-index:5;
}

.close-modal:hover{color:#fff;border-color:var(--cyan)}

.field{
 width:100%;
 padding:11px 12px;
 margin-bottom:10px;
 border-radius:9px;
 border:1px solid var(--border);
 background:rgba(0,0,0,.3);
 color:#fff;
 outline:none;
 font-size:12px;
}

.field:focus{border-color:var(--cyan)}

.submit-btn{
 width:100%;
 border:0;
 padding:11px;
 border-radius:9px;
 background:linear-gradient(135deg,var(--cyan),var(--green));
 color:#000;
 font-size:11px;
 font-weight:800;
}

/* PROFESSIONAL NOTIFICATION */
.notify-box{
 text-align:center;
 padding:28px 22px 22px;
}

.notify-icon{
 width:65px;
 height:65px;
 margin:0 auto 13px;
 display:grid;
 place-items:center;
 border-radius:50%;
 font-size:26px;
 color:var(--green);
 background:rgba(0,230,118,.09);
 border:1px solid rgba(0,230,118,.4);
 box-shadow:0 0 25px rgba(0,230,118,.08);
}

.notify-icon.info{
 color:var(--cyan);
 background:rgba(0,217,255,.08);
 border-color:rgba(0,217,255,.35);
}

.notify-icon.error{
 color:var(--red);
 background:rgba(255,82,82,.08);
 border-color:rgba(255,82,82,.35);
}

#notifyTitle{
 font-size:18px;
 margin-bottom:6px;
}

#notifyMessage{
 color:var(--muted);
 font-size:12px;
 line-height:1.6;
 white-space:pre-line;
}

/* CART */
.cart-drawer-list{
 max-height:300px;
 overflow-y:auto;
 margin:15px 0;
 border-top:1px solid var(--border);
 border-bottom:1px solid var(--border);
}

.cart-item-row{
 display:flex;
 align-items:center;
 gap:8px;
 padding:10px 0;
 border-bottom:1px solid rgba(255,255,255,.05);
}

.cart-item-row:last-child{border-bottom:0}

.cart-item-row img{
 width:45px;
 height:45px;
 object-fit:cover;
 border-radius:7px;
}

.cart-item-details{flex:1}
.cart-item-details h5{
 font-size:10px;
 line-height:1.4;
}

.cart-item-details span{
 color:var(--cyan);
 font-size:10px;
}

.cart-qty-ctrl{
 display:flex;
 align-items:center;
 gap:5px;
}

.cart-qty-btn{
 width:21px;
 height:21px;
 border:0;
 border-radius:5px;
 background:rgba(255,255,255,.08);
 color:#fff;
}

.remove-cart-item{
 color:var(--red);
 cursor:pointer;
 font-size:12px;
 margin-left:3px;
}

/* ACCOUNT PROFILE */
.prof-account-card{
 width:min(450px,100%);
 overflow:hidden;
 border-radius:22px;
 background:#0b1423;
 border:1px solid rgba(255,255,255,.1);
 box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.prof-account-header{
 position:relative;
 padding:30px 20px 23px;
 text-align:center;
 background:
 radial-gradient(circle at 50% 0,rgba(0,217,255,.18),transparent 45%),
 linear-gradient(145deg,#0d1a2d,#0a111e);
 border-bottom:1px solid var(--border);
}

.profile-cover-line{
 position:absolute;
 top:0;
 left:0;
 right:0;
 height:3px;
 background:linear-gradient(90deg,var(--cyan),var(--green));
}

.prof-avatar-wrap{
 width:86px;
 height:86px;
 margin:0 auto 11px;
 position:relative;
}

.prof-avatar-wrap img{
 width:100%;
 height:100%;
 border-radius:50%;
 object-fit:cover;
 border:3px solid var(--cyan);
 padding:2px;
 background:#07101d;
}

.prof-status-badge{
 position:absolute;
 right:-3px;
 bottom:2px;
 background:var(--green);
 color:#000;
 border:3px solid #0b1423;
 padding:3px 7px;
 border-radius:15px;
 font-size:8px;
 font-weight:900;
}

.prof-account-header h3{
 font-size:19px;
 font-weight:700;
}

.prof-account-header p{
 color:var(--cyan);
 font-size:11px;
 margin-top:2px;
}

.prof-stats-bar{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 background:rgba(0,0,0,.2);
 border-bottom:1px solid var(--border);
}

.prof-stat-item{
 text-align:center;
 padding:13px 5px;
 border-right:1px solid var(--border);
}

.prof-stat-item:last-child{border:0}

.prof-stat-item h4{
 font-size:14px;
 color:#fff;
}

.prof-stat-item span{
 color:#64748b;
 font-size:8px;
 text-transform:uppercase;
 letter-spacing:.5px;
}

.prof-body{padding:18px}

.prof-info-row{
 display:flex;
 align-items:center;
 gap:12px;
 padding:11px 12px;
 margin-bottom:9px;
 border-radius:10px;
 background:rgba(255,255,255,.025);
 border:1px solid rgba(255,255,255,.055);
}

.prof-info-row>i{
 width:28px;
 height:28px;
 display:grid;
 place-items:center;
 border-radius:8px;
 color:var(--cyan);
 background:rgba(0,217,255,.08);
}

.prof-info-text{min-width:0}

.prof-info-text strong{
 display:block;
 color:#64748b;
 font-size:8px;
 text-transform:uppercase;
 margin-bottom:2px;
}

.prof-info-text span{
 display:block;
 color:#f8fafc;
 font-size:11px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.prof-action-btn{
 width:100%;
 padding:11px;
 margin-top:4px;
 margin-bottom:8px;
 border-radius:9px;
 font-size:10px;
 font-weight:800;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:7px;
}

.prof-btn-edit{
 color:var(--cyan);
 background:rgba(0,217,255,.07);
 border:1px solid rgba(0,217,255,.5);
}

.prof-btn-logout{
 color:var(--red);
 background:rgba(255,82,82,.06);
 border:1px solid rgba(255,82,82,.45);
}

/* SUPPORT CHAT */
.chat-modal-box{
 width:min(420px,100%);
 padding:0;
 overflow:hidden;
 background:#0a1321;
}

.chat-header{
 display:flex;
 align-items:center;
 gap:11px;
 padding:15px 17px;
 background:linear-gradient(135deg,#0c2030,#0c1828);
 border-bottom:1px solid var(--border);
}

.chat-avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 display:grid;
 place-items:center;
 color:#000;
 background:linear-gradient(135deg,var(--cyan),var(--green));
 font-size:18px;
 position:relative;
}

.online-dot{
 position:absolute;
 width:10px;
 height:10px;
 right:0;
 bottom:1px;
 background:var(--green);
 border:2px solid #0c1828;
 border-radius:50%;
}

.chat-head-text{flex:1}
.chat-head-text h3{font-size:14px}
.chat-head-text p{
 color:var(--green);
 font-size:9px;
}

.chat-body{
 height:330px;
 padding:15px;
 overflow-y:auto;
 background:
 radial-gradient(circle at 10% 20%,rgba(0,217,255,.03),transparent 30%),
 #08111e;
}

.chat-message{
 max-width:82%;
 margin-bottom:10px;
 padding:9px 11px;
 border-radius:12px;
 font-size:10px;
 line-height:1.5;
}

.chat-message.support{
 background:#111f31;
 border:1px solid var(--border);
 border-top-left-radius:4px;
 color:#dbeafe;
}

.chat-message.user{
 margin-left:auto;
 background:linear-gradient(135deg,rgba(0,217,255,.18),rgba(0,230,118,.12));
 border:1px solid rgba(0,217,255,.2);
 border-top-right-radius:4px;
}

.chat-time{
 display:block;
 color:#64748b;
 font-size:7px;
 margin-top:4px;
 text-align:right;
}

.quick-replies{
 display:flex;
 gap:6px;
 overflow-x:auto;
 padding:8px 12px;
 border-top:1px solid var(--border);
}

.quick-replies button{
 flex:0 0 auto;
 padding:6px 9px;
 border-radius:15px;
 color:var(--cyan);
 background:rgba(0,217,255,.05);
 border:1px solid rgba(0,217,255,.2);
 font-size:8px;
}

.chat-input-area{
 display:flex;
 gap:7px;
 padding:11px;
 border-top:1px solid var(--border);
 background:#0b1523;
}

.chat-input{
 flex:1;
 border:1px solid var(--border);
 background:#070e18;
 color:#fff;
 border-radius:20px;
 outline:0;
 padding:9px 12px;
 font-size:10px;
}

.chat-send{
 width:37px;
 height:37px;
 border:0;
 border-radius:50%;
 background:linear-gradient(135deg,var(--cyan),var(--green));
 color:#000;
}

/* MOBILE NAV */
.mobile-bottom-nav{
 display:none;
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:9999;
 background:rgba(7,11,19,.96);
 backdrop-filter:blur(15px);
 border-top:1px solid var(--border);
 padding:8px 5px;
 justify-content:space-around;
}

.nav-item{
 flex:1;
 text-align:center;
 color:#64748b;
 font-size:8px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:3px;
}

.nav-item i{font-size:17px}
.nav-item.active{color:var(--cyan)}

footer{
 margin-top:30px;
 padding:22px;
 border-top:1px solid var(--border);
 color:#64748b;
 text-align:center;
 font-size:9px;
}

/* RESPONSIVE */
@media(max-width:992px){
 .hero-layout{grid-template-columns:1fr}
 .cat-sidebar,.side-promo{display:none}
}

@media(max-width:576px){
 body{padding-bottom:65px}
 .top-navy-bar{display:none}
