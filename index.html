<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Ibrahim | Graphic Designer</title>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 20px auto; background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 25px; }
        .header h1 { margin: 0; color: #1a1a1a; font-size: 28px; }
        .header p { color: #007bff; font-weight: 600; font-size: 18px; margin: 5px 0 0 0; }
        .contact-info { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
        .contact-info p { margin: 8px 0; font-size: 15px; }
        .contact-info a { color: #007bff; text-decoration: none; font-weight: 500; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #cccccc; border-radius: 6px; font-size: 14px; }
        input:focus, textarea:focus { border-color: #007bff; outline: none; }
        button { background-color: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: 600; }
        button:hover { background-color: #0056b3; }
        #status-msg { margin-top: 15px; font-weight: 600; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Section -->
    <div class="header">
        <h1>MUHAMMAD IBRAHIM</h1>
        <p>Graphic Designer</p>
    </div>

    <!-- Direct Contact Info -->
    <div class="contact-info">
        <p><strong>Email:</strong> <a href="mailto:hybusinessprint@gmail.com">hybusinessprint@gmail.com</a></p>
        <p><strong>Phone / WhatsApp:</strong> <a href="tel:03209306672">0320-9306672</a></p>
    </div>

    <!-- Contact Form -->
    <h2>Contact Me</h2>
    <form id="contact-form">
        <div class="form-group">
            <label for="user_name">Aapka Naam:</label>
            <input type="text" id="user_name" required placeholder="Apna naam likhein">
        </div>

        <div class="form-group">
            <label for="user_email">Aapka Email:</label>
            <input type="email" id="user_email" required placeholder="Apna email address likhein">
        </div>

        <div class="form-group">
            <label for="message">Paigham (Message):</label>
            <textarea id="message" rows="5" required placeholder="Graphic design ke kam ke hawale se paigham likhein..."></textarea>
        </div>

        <button type="submit" id="btn-submit">Message Bheinjein</button>
    </form>

    <p id="status-msg"></p>
</div>

</body>
</html>
