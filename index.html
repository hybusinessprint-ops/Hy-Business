<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HY STORE - Official Online Store</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #060b13;
            color: #ffffff;
            padding-bottom: 70px;
        }

        /* HEADER SECTION */
        header {
            background-color: #090e17;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #141c2b;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .logo-area h1 {
            color: #0088ff; /* CHANGED TO BLUE */
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-area span {
            color: #ffffff;
        }

        .tagline {
            color: #64748b;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: -2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background-color: #121a29;
            border: 1px solid #1e293b;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #ff3b30;
            color: white;
            font-size: 10px;
            font-weight: bold;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SEARCH BAR */
        .search-container {
            display: flex;
            align-items: center;
            background-color: #0d1522;
            border: 1px solid #1e2d42;
            border-radius: 8px;
            overflow: hidden;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-btn {
            background-color: #0088ff; /* CHANGED TO BLUE */
            border: none;
            width: 42px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
        }

        /* MAIN CONTAINER */
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* HERO BANNER CAROUSEL */
        .banner-card {
            background: linear-gradient(135deg, #0b1a30 0%, #0f2b48 50%, #123860 100%); /* BLUE GRADIENT */
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .banner-tag {
            background-color: #091b33;
            color: #0088ff; /* CHANGED TO BLUE */
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
            width: fit-content;
            margin-bottom: 12px;
            border: 1px solid #133863;
        }

        .banner-title {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 8px;
            max-width: 65%;
        }

        .banner-title span {
            color: #0088ff; /* CHANGED TO BLUE */
        }

        .banner-desc {
            font-size: 11px;
            color: #cbd5e1;
            max-width: 60%;
            margin-bottom: 16px;
        }

        .banner-btn {
            background-color: #0088ff; /* CHANGED TO BLUE */
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            width: fit-content;
        }

        .headphone-img {
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 170px;
            pointer-events: none;
        }

        /* CAROUSEL CONTROLS */
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 16px;
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.3);
        }

        .dot.active {
            width: 16px;
            border-radius: 4px;
            background-color: #0088ff; /* CHANGED TO BLUE */
        }

        .carousel-arrows {
            position: absolute;
            bottom: 12px;
            right: 16px;
            display: flex;
            gap: 6px;
        }

        .arrow-btn {
            background: rgba(0, 0, 0, 0.4);
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* FEATURES GRID */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .feature-card {
            background-color: #0a111c;
            border: 1px solid #162032;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: left;
        }

        .feature-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #0c1f38;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0088ff; /* CHANGED TO BLUE */
            margin-bottom: 10px;
        }

        .feature-title {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .feature-sub {
            font-size: 9px;
            color: #64748b;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #070d17;
            border-top: 1px solid #141c2b;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #64748b;
            text-decoration: none;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-item.active {
            color: #0088ff; /* CHANGED TO BLUE */
        }
    </style>
</head>
<body>

    <!-- HEADER SECTION -->
    <header>
        <div class="header-top">
            <div class="logo-area">
                <h1>HY <span>STORE</span></h1>
                <div class="tagline">OFFICIAL ONLINE STORE</div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" aria-label="Box"><i data-lucide="package" size="18"></i></button>
                <button class="icon-btn" aria-label="Profile"><i data-lucide="user" size="18"></i></button>
                <button class="icon-btn" aria-label="Cart">
                    <i data-lucide="shopping-cart" size="18"></i>
                    <span class="badge">0</span>
                </button>
            </div>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-container">
            <input type="text" placeholder="Search 2000+ products..." class="search-input">
            <button class="search-btn" aria-label="Search">
                <i data-lucide="search" size="18"></i>
            </button>
        </div>
    </header>

    <!-- MAIN BODY CONTENT -->
    <div class="container">
        
        <!-- HERO BANNER CAROUSEL -->
        <div class="banner-card">
            <div>
                <span class="banner-tag">AUDIO GEAR</span>
                <h2 class="banner-title">Premium Sound.<br><span>Best Deals.</span></h2>
                <p class="banner-desc">Get up to 40% off on premium wireless audio equipment.</p>
                <button class="banner-btn">
                    EXPLORE AUDIO <i data-lucide="arrow-right" size="14"></i>
                </button>
            </div>

            <!-- Headphone Image Placeholder -->
            <img src="https://i.ibb.co/6P0L83N/headphones.png" alt="Audio Gear" class="headphone-img" onerror="this.style.display='none'">

            <!-- Carousel Indicators & Arrows -->
            <div class="carousel-dots">
                <div class="dot"></div>
                <div class="dot active"></div>
            </div>
            <div class="carousel-arrows">
                <button class="arrow-btn" aria-label="Previous"><i data-lucide="chevron-left" size="14"></i></button>
                <button class="arrow-btn" aria-label="Next"><i data-lucide="chevron-right" size="14"></i></button>
            </div>
        </div>

        <!-- THREE FEATURES SECTION -->
        <div class="features-grid">
            <div class="feature-card">
                <div class="feature-icon"><i data-lucide="check-circle-2" size="14"></i></div>
                <div class="feature-title">100% Authentic</div>
                <div class="feature-sub">Verified<br>Goods</div>
            </div>

            <div class="feature-card">
                <div class="feature-icon"><i data-lucide="truck" size="14"></i></div>
                <div class="feature-title">Cash on Delivery</div>
                <div class="feature-sub">Pay Upon<br>Receipt</div>
            </div>

            <div class="feature-card">
                <div class="feature-icon"><i data-lucide="message-square" size="14"></i></div>
                <div class="feature-title">Live Support</div>
                <div class="feature-sub">24/7<br>Customer Care</div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i data-lucide="home" size="18"></i>
            <span>HOME</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="shopping-bag" size="18"></i>
            <span>PRODUCTS</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="box" size="18"></i>
            <span>ORDERS</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="message-circle" size="18"></i>
            <span>CHATS</span>
        </a>
        <a href="#" class="nav-item">
            <i data-lucide="user" size="18"></i>
            <span>PROFILE</span>
        </a>
    </nav>

    <!-- Icons Initialization -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
